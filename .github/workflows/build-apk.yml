name: build-apk

# Build APK Android otomatis — tanpa Android Studio lokal.
# Jalankan: push ke main/master, tag v*, atau manual (Actions → build-apk → Run).
# Hasil: artifact "grokbot-debug-apk" (app-debug.apk) di halaman run.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan Android SDK + NDK (untuk gomobile)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Verifikasi Go kit (gofmt · vet · build)
        run: |
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then echo "perlu gofmt:"; echo "$OUT"; exit 1; fi
          go vet ./...
          go build ./...

      - name: gomobile bind → botlib.aar
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 24 \
            -o android/app/libs/botlib.aar ./android/botlib
          ls -la android/app/libs/

      - name: gradle assembleDebug → app-debug.apk
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Ringkasan
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          echo "### APK siap: $(basename "$APK") ($(du -h "$APK" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          echo "Unduh dari tab **Artifacts** run ini." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grokbot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
