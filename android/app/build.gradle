plugins { id 'com.android.application' }

android {
    namespace 'com.grokbot.desk'
    compileSdk 34

    defaultConfig {
        applicationId "com.grokbot.desk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation files('libs/botlib.aar')   // hasil gomobile bind
}
